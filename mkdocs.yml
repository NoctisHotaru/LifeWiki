site_name: Life Wiki
site_description: 一份写给普通人的生活指南知识库
site_author: Life Wiki

# 网站正式发布后的地址（绑定自己的域名后，这里要同步改）
site_url: https://noctishotaru.github.io/LifeWiki/

# 源码仓库地址（页面右上角会显示入口）
repo_url: https://github.com/NoctisHotaru/LifeWiki
repo_name: NoctisHotaru/LifeWiki

# 关掉“编辑本页”按钮（本站不做在线编辑）
edit_uri: ""

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 出行指南:
      - 高铁乘坐指南: high-speed-rail/index.md
      - 地铁乘坐指南: metro/index.md
      - 飞机乘坐指南: flight/index.md
  - 避坑指南:
      - 配眼镜: glasses/index.md
  - 情感问题:
      - 什么是恋爱: emotions/what-is-love.md
      - 健康的恋爱关系是怎样的: emotions/healthy-relationship.md
      - 我总是非常在意他/她的行为，影响到我学习了，该如何解决: emotions/overthinking-partner.md
  - 人际关系:
      - 如何看待人际关系: social/understanding-relationships.md
      - 如何处理人际关系: social/handling-relationships.md
  - 生活与求助:
      - 贫困生如何利用资源: student-resources/index.md
      - 突遇变故如何求助: emergency-help/index.md
  - 一些思考:
      - 为什么大家都这么厉害，为什么我什么都不会: thoughts/feeling-left-behind.md

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search:
      separator: '[\s\u200b\-]'
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
